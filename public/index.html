<!DOCTYPE html>
<html lang="ko">
<head>

  <title>SALON VIP</title>

  <!-- PWA: 홈 화면 추가 시 전체화면 앱처럼 실행 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- 앱 아이콘 (Apple Touch Icon) -->
  <link rel="apple-touch-icon" href="static/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
  <link href="static/customer.css?v=7" rel="stylesheet">
  <script>window.__INITIAL_PAGE__ = 'home';</script>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7">
  <script>
    if ('serviceWorker' in navigator) {
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloaded) return;
        reloaded = true;
        location.reload();
      });
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <div id="app"></div>
  <script src="static/product-catalog.js?v=2"></script>
  <script src="static/local-api.js?v=6"></script>
  <script src="static/customer.js?v=10"></script>

</body>
</html>
